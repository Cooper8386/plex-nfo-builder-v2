services:
  config-init:
    image: ghcr.io/cooper8386/plex-nfo-builder-v2:${IMAGE_TAG:-edge}
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R ${PUID:-1000}:${PGID:-1000} /config"]
    volumes:
      - ${CONFIG_PATH:-plex-nfo-builder-config}:/config
    restart: "no"

  plex-nfo-builder:
    image: ghcr.io/cooper8386/plex-nfo-builder-v2:${IMAGE_TAG:-edge}
    build: .
    ports:
      - "${HOST_PORT:-8765}:${LISTEN_PORT:-8000}"
    environment:
      API_TOKEN: ${API_TOKEN:?Set a strong API_TOKEN in .env before starting}
      MEDIA_ROOT: /media
      CONFIG_DIR: /config
      LISTEN_HOST: ${LISTEN_HOST:-0.0.0.0}
      LISTEN_PORT: ${LISTEN_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Chicago}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      TVDB_PIN: ${TVDB_PIN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      FANART_API_KEY: ${FANART_API_KEY:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      WATCHER_ENABLED: ${WATCHER_ENABLED:-true}
      WATCHER_DEBOUNCE_SECONDS: ${WATCHER_DEBOUNCE_SECONDS:-30}
      WATCHER_MAX_INFLIGHT: ${WATCHER_MAX_INFLIGHT:-2}
      WATCHER_KILL_SWITCH: ${WATCHER_KILL_SWITCH:-false}
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${MEDIA_PATH:?Set MEDIA_PATH to the host media directory}
        target: /media
        bind:
          create_host_path: false
      - ${CONFIG_PATH:-plex-nfo-builder-config}:/config
    restart: unless-stopped

volumes:
  plex-nfo-builder-config:
